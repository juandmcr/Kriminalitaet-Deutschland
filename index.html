<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Checkboxen mit Bestätigung</title>
        <script src="https://unpkg.com/d3-regression@1.3.10/dist/d3-regression.min.js"></script>
        <script type="module" src="./main.js"></script>
        <style>
    body {
        font-family: Arial, sans-serif;
        margin: 10px;
    }
    #regressionControl {
        margin-bottom: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        background-color: #f9f9f9;
        border-radius: 4px;
    }
    #regressionControl label {
        margin-right: 15px;
    }
    #regressionControl select {
        padding: 5px;
        font-size: 14px;
    }
    #chartsContainer {
        display: flex;
        gap: 20px;
    }
    @media (max-width: 768px) {
        #chartsContainer {
            flex-direction: column;
            gap: 20px;
        }
        svg {
            width: 100% !important;
            height: auto !important;
        }
    }

    /* NUEVAS REGLAS (solo para viewBox) */
    #chartsContainer svg {
        width: 100% !important;
        height: auto !important;
        max-width: 100%;
        display: block;
    }
</style>
    </head>
    <body>
        <div id="regressionControl">
            <label for="regressionType">Regression Type:</label>
            <select id="regressionType">
                <option value="linear">Linear</option>
                <option value="exponential">Exponential</option>
                <option value="logarithmic">Logarithmic</option>
                <option value="quadratic">Quadratic</option>
                <option value="polynomial">Polynomial</option>
                <option value="powerlaw">Power Law</option>
                <option value="loess">LOESS</option>
            </select>
        </div>

        <form id="meinFormular">
            <fieldset>
                <legend>Armut</legend>
                <label
                    ><input type="checkbox" name="Armut" value="alq" />
                    Arbeitslosenquote bezogen auf alle zivilen Erwerbspersonen
                    im Jahr 2023 in %</label
                ><br />
                <label
                    ><input type="checkbox" name="Armut" value="schulden" />
                    Anteil überschuldeter Personen über 18 Jahre an der
                    Altersgruppe im Jahr 2023 in %</label
                >
            </fieldset>

            <fieldset>
                <legend>Demographie</legend>
                <label
                    ><input
                        type="checkbox"
                        name="Demographie"
                        value="bev_u18"
                    />
                    Anteil der unter 18-Jährigen an der Gesamtbevölkerung im
                    Jahr 2024 in %</label
                ><br />
                <label
                    ><input
                        type="checkbox"
                        name="Demographie"
                        value="bev_18_65"
                    />
                    Anteil der 18- bis unter 65-Jährigen an der
                    Gesamtbevölkerung im Jahr 2024 in %</label
                ><br />
                <label
                    ><input
                        type="checkbox"
                        name="Demographie"
                        value="bev_ue65"
                    />
                    Anteil der 65-Jährigen und Älteren an der Gesamtbevölkerung
                    im Jahr 2024 in %</label
                >
            </fieldset>

            <fieldset>
                <legend>Wirtschaft</legend>
                <label
                    ><input type="checkbox" name="Wirtschaft" value="erw_bip" />
                    Bruttoinlandsprodukt je erwerbstätige Person im Jahr 2023 in
                    1.000 €</label
                ><br />
                <label
                    ><input
                        type="checkbox"
                        name="Wirtschaft"
                        value="hh_veinK"
                    />
                    Verfügbares Einkommen privater Haushalte je Einwohner/-in im
                    Jahr 2023 in 1.000 €</label
                >
            </fieldset>

            <fieldset>
                <legend>Migration</legend>
                <label
                    ><input type="checkbox" name="Migration" value="bev_ausl" />
                    Anteil der Ausländer/-innen an der Gesamtbevölkerung im Jahr
                    2024 in %</label
                >
            </fieldset>

            <fieldset>
                <legend>Vereinswesen</legend>
                <label
                    ><input
                        type="checkbox"
                        name="Vereinswesen"
                        value="mitgl_sportv"
                    />
                    Mitglieder in Sportvereinen je 100 Einwohner im Jahr
                    2023</label
                ><br />
                <label
                    ><input
                        type="checkbox"
                        name="Vereinswesen"
                        value="ew_sportv"
                    />
                    Sportvereine je 100.000 Einwohner/-innen im Jahr 2023</label
                >
            </fieldset>

            <br />

            <button type="button" id="bestaetigen">Eingabe bestätigen</button>
        </form>

        <p>
            Quelle:
            https://www.deutschlandatlas.bund.de/SharedDocs/Downloads/DE/Deutschlandatlas-Daten.html
        </p>
        <p>Verwendete Tabellen: KRS1222, KRS1224</p>
    </body>
</html>
